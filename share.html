<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transparency Estate — объект</title>
  <link rel="icon" href="icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="vibe.js" defer></script>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <header>Transparency Estate</header>
  <div class="wrap" id="root"><div class="state">Загрузка…</div></div>
  <footer></footer>
  <div id="lb"><img id="lbImg" src="" alt=""></div>
  <div id="live" class="live-win" style="display:none">
    <div class="live-head" id="liveHead">
      <span class="live-badge">LIVE</span>
      <span class="live-title">Прямой эфир</span>
      <span class="live-sp"></span>
      <button class="live-btn" id="liveExpand" title="Развернуть">⤢</button>
      <button class="live-btn" id="liveClose" title="Закрыть">✕</button>
    </div>
    <div class="live-body" id="liveBody"></div>
  </div>
  <script>
  const SUPABASE_URL = "https://pqmjulphghojlaijffty.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_yrj4fEkOl0uGoKT1i_NgyQ_vGrbi73Z";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession:false, autoRefreshToken:false, lock:(_n,_t,fn)=>fn() }
  });
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const token = new URLSearchParams(location.search).get('t');

  // Этапы (совпадают с index.html) — для прогресс-бара.
  const STATUSES = [
    { label:'Проектирование', color:'#5b7fa6' }, { label:'Идёт планировка', color:'#d68a3a' },
    { label:'Стройка', color:'#b4453a' }, { label:'Посадка крупномеров', color:'#6b7257' },
    { label:'Благоустройство', color:'#8a6ba6' }, { label:'Завершён', color:'#8a8782' },
  ];
  const companyName = c => c==='zelege' ? 'Zelege' : 'Kampika';
  function tgLink(u, objName){
    const user = String(u).replace(/^@/,'').replace(/^https?:\/\/t\.me\//,'').replace(/^t\.me\//,'');
    return 'https://t.me/'+encodeURIComponent(user)+'?text='+encodeURIComponent('Здравствуйте! Я по объекту «'+objName+'»');
  }
  // Контактные окна из данных: персональный менеджер объекта (если задан) + поддержка компании (базовое).
  function contactWindows(o){
    let html = '';
    if(o.manager_tg) html += `<a class="mgr" href="${tgLink(o.manager_tg, o.name)}">Написать своему менеджеру</a>`;
    if(o.support_tg) html += `<a class="mgr ghost" href="${tgLink(o.support_tg, o.name)}">Написать в поддержку ${esc(companyName(o.company))}</a>`;
    else if(o.support_url) html += `<a class="mgr ghost" href="${esc(o.support_url)}" target="_blank" rel="noopener">Связаться с ${esc(companyName(o.company))}</a>`;
    return html ? `<div class="sec">Связаться</div>${html}` : '';
  }

  function state(msg){ document.getElementById('root').innerHTML = `<div class="state">${esc(msg)}</div>`; }

  // Реакции клиента на запись ленты (одна на кадр+эмодзи с браузера, дедуп через localStorage).
  const REACT_EMOJIS = ['👍','❤️','🔥'];
  function reactionRow(f){
    const r=f.reactions||{};
    return `<div class="react" data-fid="${f.id}">${REACT_EMOJIS.map(e=>`<button class="react-btn${localStorage.getItem('tl_react_'+f.id+'_'+e)?' reacted':''}" data-emo="${e}">${e} <span class="rc">${r[e]||0}</span></button>`).join('')}</div>`;
  }
  async function reactTo(btn){
    const row=btn.closest('.react'), fid=+row.dataset.fid, emo=btn.dataset.emo, key='tl_react_'+fid+'_'+emo;
    if(localStorage.getItem(key)) return;
    const cnt=btn.querySelector('.rc');
    cnt.textContent=(+cnt.textContent||0)+1; btn.classList.add('reacted');
    try{ localStorage.setItem(key,'1'); await sb.rpc('react_shared',{ token, fid, emo }); }catch(e){}
  }

  // Скачивание документа: Edge Function подписывает ссылку по share-токену.
  async function downloadDoc(btn){
    const id=btn.dataset.id, orig=btn.innerHTML;
    btn.disabled=true; btn.textContent='Открываю…';
    try{
      const { data, error } = await sb.functions.invoke('sign-doc', { body: { token, doc_id:+id } });
      if(!error && data && data.url) window.open(data.url,'_blank');
      else btn.textContent='Не открылось, попробуй ещё раз';
    }catch(e){ btn.textContent='Не открылось, попробуй ещё раз'; }
    finally{ btn.disabled=false; setTimeout(()=>{ btn.innerHTML=orig; }, 2500); }
  }

  function stagesBar(status){
    const idx = STATUSES.findIndex(s=>s.label===status);
    const segs = STATUSES.map((s,i)=>`<span class="seg" style="${i<=idx?`background:${s.color};`:''}"></span>`).join('');
    return `<div class="stages">${segs}</div>
      <div class="stages-cap">Этап ${idx>=0?idx+1:'—'} из ${STATUSES.length}${idx>=0?` · ${esc(STATUSES[idx].label)}`:''}</div>`;
  }

  // Дайджест «за неделю» — считается на лету из согласованной ленты (без бэкенда).
  function weekDigest(feed){
    const weekAgo = Date.now() - 7*86400000;
    const recent = feed.filter(f => new Date(f.created_at).getTime() > weekAgo);
    if(!recent.length) return null;
    const photos = recent.reduce((n,f)=>n+((f.photos||[]).length),0);
    const parts = [`${recent.length} ${plural(recent.length,'отчёт','отчёта','отчётов')}`];
    if(photos) parts.push(`${photos} ${plural(photos,'фото','фото','фото')}`);
    return parts.join(', ');
  }
  function plural(n,one,few,many){
    const m10=n%10, m100=n%100;
    if(m10===1&&m100!==11) return one;
    if(m10>=2&&m10<=4&&(m100<10||m100>=20)) return few;
    return many;
  }

  // Прогресс в % по текущему этапу (этап 3 из 6 → 50%).
  function progressPct(status){
    const idx = STATUSES.findIndex(s=>s.label===status);
    return idx>=0 ? Math.round((idx+1)/STATUSES.length*100) : 0;
  }
  // Липкая шкала готовности — всегда вверху страницы.
  function progressBar(o){
    const pct = progressPct(o.status);
    return `<div class="progress-sticky"><div class="ps-top"><span>Готовность объекта</span><b>${pct}%</b></div>
      <div class="ps-bar"><div class="ps-fill" style="width:${pct}%"></div></div></div>`;
  }
  // Веха: план текущего этапа (или общая дата, если по этапам не задано). Тон мягкий.
  function etaLine(o){
    if(o.status==='Завершён') return '';
    const sd=o.stage_dates||{}, stageDate=sd[o.status], due=stageDate||o.due_date;
    if(!due) return '';
    const d=new Date(due), today=new Date(new Date().toDateString());
    const days=Math.round((d-today)/86400000), date=d.toLocaleDateString('ru-RU');
    const head = stageDate ? `Текущий этап «${o.status}» — план до ${date}` : `Плановое завершение — ${date}`;
    let tail='';
    if(days>0) tail=`, примерно через ${days} ${plural(days,'день','дня','дней')}`;
    else if(days<0) tail='. Наводим финальные штрихи';
    return `<div class="eta">🗓 ${esc(head+tail)}</div>`;
  }
  // Роадмэп: этапы с состоянием (пройден/текущий/впереди) и план-датами.
  function roadmapHtml(o){
    const idx = STATUSES.findIndex(s=>s.label===o.status), sd=o.stage_dates||{};
    return STATUSES.map((s,i)=>{
      const st = i<idx?'done':i===idx?'current':'up', mark = st==='done'?'✓':st==='current'?'●':'○';
      const date = sd[s.label] ? new Date(sd[s.label]).toLocaleDateString('ru-RU') : '';
      return `<div class="rm-row ${st}"><span class="rm-mark">${mark}</span><span class="rm-name">${esc(s.label)}</span><span class="rm-date">${esc(date)}</span></div>`;
    }).join('');
  }

  // Таймлапс «как рос участок»: все фото ленты по хронологии, play + ползунок.
  function timelapse(feed){
    const chrono = feed.slice().reverse(); // RPC отдаёт desc → в хронологию
    const frames = [];
    chrono.forEach(f => (f.photos||[]).forEach(p => frames.push({url:p, date:f.created_at})));
    if(frames.length < 2) return '';
    window.__tlFrames = frames;
    const last = frames.length-1;
    return `<div class="sec">Как рос участок</div>
      <div class="tl">
        <img id="tlImg" src="${esc(frames[last].url)}" alt="прогресс">
        <div class="tl-ctl">
          <button id="tlPlay" class="tl-play" aria-label="Проиграть">▶</button>
          <input type="range" id="tlRange" min="0" max="${last}" value="${last}">
          <span id="tlDate" class="tl-date">${new Date(frames[last].date).toLocaleDateString('ru-RU')}</span>
        </div>
      </div>`;
  }
  function wireTimelapse(){
    const frames = window.__tlFrames; if(!frames) return;
    const img=document.getElementById('tlImg'), range=document.getElementById('tlRange'),
          dateEl=document.getElementById('tlDate'), play=document.getElementById('tlPlay');
    if(!range) return;
    frames.forEach(f=>{ const im=new Image(); im.src=f.url; }); // префетч для плавности
    const show=i=>{ img.src=frames[i].url; dateEl.textContent=new Date(frames[i].date).toLocaleDateString('ru-RU'); range.value=i; };
    range.oninput=()=> show(+range.value);
    let timer=null;
    const stop=()=>{ if(timer){ clearInterval(timer); timer=null; } play.textContent='▶'; };
    play.onclick=()=>{
      if(timer){ stop(); return; }
      play.textContent='⏸';
      let i = (+range.value>=frames.length-1) ? 0 : +range.value;
      show(i);
      timer=setInterval(()=>{ i++; if(i>=frames.length){ stop(); return; } show(i); }, 750);
    };
  }

  // Галерея: все фото ленты сеткой, тап → лайтбокс (полный экран).
  function galleryHtml(feed){
    const photos=[];
    feed.forEach(f => (f.photos||[]).forEach(p => photos.push(p)));
    if(!photos.length) return '';
    return `<div class="sec">Фотографии — ${photos.length}</div>
      <div class="gallery">${photos.map(p=>`<img src="${esc(p)}" data-full="${esc(p)}" loading="lazy">`).join('')}</div>`;
  }

  // Прямой эфир: плеер по типу ссылки. YouTube → iframe; HLS/mp4 → video (iOS/Safari натив;
  // кроссбраузерный HLS без VPN — путь 2, self-hosted hls.js); иначе — общий эмбед.
  function liveEmbed(url){
    const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
    if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}?autoplay=1&mute=1&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe>`;
    if(/\.m3u8|\.mp4/i.test(url)) return `<video src="${esc(url)}" autoplay muted playsinline controls></video>`;
    return `<iframe src="${esc(url)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen frameborder="0"></iframe>`;
  }
  function openLive(){
    const url=window.__liveUrl; if(!url) return;
    document.getElementById('liveBody').innerHTML = liveEmbed(url);
    document.getElementById('live').style.display='flex';
  }
  function closeLive(){
    const w=document.getElementById('live');
    w.style.display='none'; w.classList.remove('expanded');
    document.getElementById('liveBody').innerHTML=''; // остановить поток
  }

  // White-label: шапка со студийным лого и именем.
  function brandHeader(o){
    if(!o.logo_url && !o.display_name) return '';
    return `<div class="brand">${o.logo_url?`<img class="brand-logo" src="${esc(o.logo_url)}" alt="">`:''}${o.display_name?`<span class="brand-name">${esc(o.display_name)}</span>`:''}</div>`;
  }
  // Режим ухода после сдачи: сезонный гайд по саду.
  const CARE_TIPS = {
    spring: ['Осмотрите сад после зимы: снимите укрытия, уберите сломанные ветки.', 'Первая подкормка и санитарная обрезка — до активного роста.', 'Пролейте посадки, обновите мульчу в приствольных кругах.'],
    summer: ['Полив в жару — рано утром или вечером, обильно и под корень.', 'Стрижка газона раз в неделю, прополка цветников.', 'Следите за вредителями на молодых посадках — заметили, напишите нам.'],
    autumn: ['Влагозарядный полив деревьев и хвойных перед холодами.', 'Уберите листву с газона, замульчируйте многолетники.', 'Укройте теплолюбивые растения до первых устойчивых морозов.'],
    winter: ['Стряхивайте тяжёлый снег с хвойных и крон — чтобы не разломило.', 'Не ходите по газону под снегом.', 'Проверьте укрытия после оттепелей и метелей.'],
  };
  function afterCare(o){
    if(o.status!=='Завершён') return '';
    const s = (window.Vibe && Vibe.season) ? Vibe.season() : 'summer';
    const title = {spring:'Весной',summer:'Летом',autumn:'Осенью',winter:'Зимой'}[s];
    return `<div class="care-guide">
      <div class="cg-head">🌿 Уход за садом · ${title}</div>
      <ul class="cg-list">${CARE_TIPS[s].map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
      <div class="cg-foot">Мы рядом — если сомневаетесь, что и когда делать, напишите менеджеру.</div>
    </div>`;
  }

  (async()=>{
    if(!token){ state('Ссылка недоступна. Попроси менеджера прислать её заново.'); return; }
    const { data, error } = await sb.rpc('get_shared_object', { token });
    if(error){ state('Не получилось загрузить объект — проверь связь и обнови страницу.'); return; }
    if(!data){ state('Объект не найден. Возможно, ссылку обновили — попроси у менеджера новую.'); return; }
    const o = data;
    window.__liveUrl = o.live_url;
    const feed = o.feed || [];
    const digest = weekDigest(feed);
    if(o.brand_color) document.body.style.setProperty('--accent', o.brand_color); // инлайн на body > сезонного класса

    document.getElementById('root').innerHTML = `
      ${brandHeader(o)}
      ${progressBar(o)}
      ${o.cover_url?`<img class="cover" src="${esc(o.cover_url)}">`:''}
      <h1>${esc(o.name)}</h1>
      <div class="meta"><span class="badge">${esc(o.status||'—')}</span>${o.care?' <span class="care-badge">🌿 на сезонном обслуживании</span>':''}</div>
      ${o.address?`<div class="meta">📍 ${esc(o.address)}</div>`:''}
      ${afterCare(o)}
      <div class="weather" id="weather"></div>
      ${stagesBar(o.status)}
      ${etaLine(o)}
      ${o.live_url ? '<button class="live-open" id="liveOpen"><span class="lo-dot"></span> Прямой эфир с объекта</button>' : ''}
      <button class="roadmap-btn" id="roadmapBtn">Показать план работ</button>
      <div class="roadmap" id="roadmapBox">${roadmapHtml(o)}</div>
      ${digest?`<div class="digest"><div class="dh">За последнюю неделю</div><div class="dl">${esc(digest)} — работа идёт.</div></div>`:''}
      ${timelapse(feed)}
      ${galleryHtml(feed)}
      <div class="sec">Ход работ</div>
      ${feed.length? feed.map(f=>`
        <div class="item">
          <div class="d">${f.status?esc(f.status)+' · ':''}${new Date(f.created_at).toLocaleDateString('ru-RU')}</div>
          ${f.body?`<div class="b">${esc(f.body)}</div>`:''}
          ${(f.photos||[]).length?`<div class="ph">${f.photos.map(p=>`<img src="${esc(p)}" data-full="${esc(p)}">`).join('')}</div>`:''}
          ${reactionRow(f)}
        </div>`).join('') : '<div class="item">Пока тихо — скоро здесь появятся первые новости с участка.</div>'}
      ${(o.docs&&o.docs.length)?`<div class="sec">Документы</div><div class="docs">${o.docs.map(d=>`<button class="doc-dl" data-id="${d.id}">📄 ${esc(d.name)}</button>`).join('')}</div>`:''}
      ${contactWindows(o)}
    `;
    document.querySelector('footer').textContent = 'Объект компании ' + (o.display_name || (o.company==='zelege'?'Zelege':'Kampika'));
    // Сигнал вовлечённости: считаем одно открытие на сессию (throttle клиентом).
    if(!sessionStorage.getItem('tev_'+token)){ sb.rpc('log_portal_view',{ token }); sessionStorage.setItem('tev_'+token,'1'); }
    document.querySelectorAll('.ph img, .gallery img').forEach(img=> img.onclick=()=>{ document.getElementById('lbImg').src=img.dataset.full; document.getElementById('lb').classList.add('open'); });
    wireTimelapse();
    const rb=document.getElementById('roadmapBtn'), rbox=document.getElementById('roadmapBox');
    if(rb) rb.onclick=()=>{ const open=rbox.classList.toggle('open'); rb.textContent=open?'Скрыть план работ':'Показать план работ'; };
    const lo=document.getElementById('liveOpen'); if(lo) lo.onclick=openLive;
    document.querySelectorAll('.react-btn').forEach(b=> b.onclick=()=> reactTo(b));
    document.querySelectorAll('.doc-dl').forEach(b=> b.onclick=()=> downloadDoc(b));

    // Погода (Т7): фразы наполняет исполнитель; пока WEATHER_PHRASES пуст — блок молча пуст.
    if(window.Vibe && o.lat && o.lon){
      Vibe.getWeather(o.lat, o.lon).then(w=>{
        const p = Vibe.weatherPhrase(w, false);
        if(p) document.getElementById('weather').textContent = p;
      }).catch(()=>{});
    }
  })();
  document.getElementById('lb').onclick = ()=> document.getElementById('lb').classList.remove('open');

  // Эфир: закрыть / развернуть / перетаскивание окна
  document.getElementById('liveClose').onclick = closeLive;
  document.getElementById('liveExpand').onclick = ()=>{ const w=document.getElementById('live'); w.classList.toggle('expanded'); w.style.left=w.style.top=w.style.right=w.style.bottom=''; };
  (function(){
    const w=document.getElementById('live'), h=document.getElementById('liveHead');
    let sx,sy,ox,oy,drag=false;
    const start=(x,y)=>{ if(w.classList.contains('expanded')) return; drag=true; sx=x; sy=y; const r=w.getBoundingClientRect(); ox=r.left; oy=r.top; w.style.transition='none'; };
    const move=(x,y)=>{ if(!drag) return; w.style.left=(ox+x-sx)+'px'; w.style.top=(oy+y-sy)+'px'; w.style.right='auto'; w.style.bottom='auto'; };
    const end=()=>{ drag=false; w.style.transition=''; };
    h.addEventListener('mousedown',e=>{ if(e.target.tagName==='BUTTON') return; e.preventDefault(); start(e.clientX,e.clientY); });
    window.addEventListener('mousemove',e=> move(e.clientX,e.clientY));
    window.addEventListener('mouseup',end);
    h.addEventListener('touchstart',e=>{ if(e.target.tagName==='BUTTON') return; const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
    window.addEventListener('touchmove',e=>{ if(!drag) return; e.preventDefault(); const t=e.touches[0]; move(t.clientX,t.clientY); },{passive:false});
    window.addEventListener('touchend',end);
  })();
  </script>
</body>
</html>
